# ECHO local infrastructure (Day 1: PostgreSQL only).
# Values come from the root .env (copy of .env.example); defaults match .env.example.
name: echo

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-echo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-echo_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-echo}
    ports:
      # Host port 5433 (5432 is commonly taken); loopback only.
      - "127.0.0.1:5433:5432"
    volumes:
      - echo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  echo_pgdata:
