[project]
name = "echo-backend"
version = "0.1.0"
description = "ECHO backend: event-conditioned forecasting and market intelligence API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "polars>=1.44.2",
    "pyyaml>=6.0.3",
    "numpy>=2.5.3",
    "massive>=2.8.0",
    "alpaca-py>=0.44.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
]
text = [
    "torch>=2.4",
    "transformers>=4.48",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions/__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
